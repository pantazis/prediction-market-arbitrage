polymarket:
  enabled: true
  host: "https://gamma-api.polymarket.com"
kalshi:
  enabled: true  # Set to true to enable Kalshi markets
  # Credentials loaded from environment variables:
  # KALSHI_API_KEY_ID, KALSHI_PRIVATE_KEY_PEM, KALSHI_API_HOST, KALSHI_ENV
  env: prod  # "prod" or "demo"
  min_liquidity_usd: 500.0
  min_days_to_expiry: 1
risk:
  max_allocation_per_market: 0.05
  max_open_positions: 20
  min_liquidity_usd: 100.0         # RELAXED: was 500 (too strict for current data)
  min_net_edge_threshold: 0.001    # RELAXED: was 0.005 (0.1% edge vs 0.5%)
  kill_switch_drawdown: 0.2
  
  # ==================== SHORT SELLING PREVENTION FILTERS ==================== #
  # These filters ensure NO strategy requiring short selling reaches execution
  min_gross_edge: 0.05              # 5% minimum gross edge (before fees/slippage)
  min_buy_price: 0.02               # Reject BUY prices < $0.02 (dust liquidity filter)
  min_liquidity_multiple_strict: 3.0  # BUY-side depth must be >= 3x trade size
  min_expiry_hours: 24.0            # Reject markets expiring within 24 hours
  max_entry_spread_pct: 0.10        # Maximum 10% spread for entry
  kill_switch_on_partial: true      # Cancel remaining orders on partial fill
broker:
  initial_cash: 10000.0
  fee_bps: 10.0
  slippage_bps: 20.0
  depth_fraction: 0.05
engine:
  refresh_seconds: 1.0
  iterations: 10
  report_path: "reports/paper_trades.csv"
filter:
  require_resolution_source: true

cross_venue_matcher:
  enabled: false

detectors:
  parity_threshold: 0.99
  duplicate_price_diff_threshold: 0.05
  exclusive_sum_tolerance: 0.03
  ladder_tolerance: 0.0
  timelag_price_jump: 0.05
  timelag_persistence_minutes: 5
  # Enable/disable specific detectors
  # ==================== DUPLICATE DETECTOR: PERMANENTLY DISABLED ==================== #
  # DUPLICATE arbitrage requires cross-market short selling which is NOT supported
  # on this venue (Polymarket). This detector is HARD-DISABLED in ALL MODES.
  # RiskManager will reject any DUPLICATE opportunity that reaches approval stage.
  enable_duplicate: false       # HARD-DISABLED: Requires short selling (not supported)
  enable_ladder: true            # ENABLED: Works within same market
  enable_parity: true            # ENABLED: Works within same market (Yes + No ≠ 1.0)
  enable_exclusive_sum: true     # ENABLED: Works within same market (outcomes don't sum to 1.0)
  enable_timelag: true           # ENABLED: Price movement detection
  enable_consistency: true       # ENABLED: Logical consistency checks
telegram:
  enabled: true
  bot_token: ""
  chat_id: ""

llm_verification:
  enabled: false

strict_ab:
  enabled: true
  max_hours_diff: 24
  min_shared_tags: 1
  trade_size_usd: 100.0
  min_net_edge: 0.01
  min_expiry_hours: 24.0
  min_depth_multiple: 3.0
  watchlist_json: "data/watchlist_pairs.json"
  watchlist_csv: "data/watchlist_pairs.csv"
  audit_log: "data/pipeline_audit.jsonl"
  raw_dump_dir: "market_dumps/strict_ab"
  dry_run: true
  llm:
    enabled: true
    provider: "mock"
    model: "gpt-4o-mini"
    timeout_s: 5.0
    daily_limit: 1000
    cache_path: "data/llm_strict_ab_cache.json"
